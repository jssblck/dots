name: Branch staleness hook

on:
  pull_request:
    branches: [agents]
    paths:
      - dotclaude/hooks/branch-staleness.mjs
      - tests/branch-staleness.integration.test.mjs
      - .github/workflows/branch-staleness.yml
  push:
    branches: [agents]
    paths:
      - dotclaude/hooks/branch-staleness.mjs
      - tests/branch-staleness.integration.test.mjs
      - .github/workflows/branch-staleness.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test tests/branch-staleness.integration.test.mjs
